function toggleSidebar(e) {
  if (e) e.stopPropagation();
  sidebarOpen = !sidebarOpen;
  const sidebar = document.getElementById('sidebar-nav');
  if(!sidebar) return;
  if(sidebarOpen){
    sidebar.classList.remove('hidden');
  } else {
    sidebar.classList.add('hidden');
  }
}

document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar-nav');
  const toggleBtn = document.getElementById('sidebar-toggle-btn');
  if (!sidebar || !toggleBtn) return;

  if (sidebarOpen && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
    sidebarOpen = false;
    sidebar.classList.add('hidden');
  }
});

function formatDateBR(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('T')[0].split('-');
  if (parts.length !== 3) return dateStr;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function entity(key){ return ENTITIES.find(e=>e.key===key); }
function findRecord(key,id){ return (db[key]||[]).find(r=>r[entity(key).pk]===id); }
function refLabel(refKey,id){
  const ent = entity(refKey), rec = findRecord(refKey,id);
  return rec ? ent.display(rec) : `#${id}`;
}
function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function apiList(table){
  const r = await fetch(`${API_BASE}/api/${table}`);
  if(!r.ok) {
    const errorData = await r.json().catch(() => ({}));
    throw new Error(errorData.error || 'Falha ao carregar ' + table);
  }
  return r.json();
}
async function apiCreate(table, body){
  const r = await fetch(`${API_BASE}/api/${table}`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Falha ao criar registro.');
  return data;
}
async function apiUpdate(table, id, body){
  const r = await fetch(`${API_BASE}/api/${table}/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Falha ao atualizar registro.');
  return data;
}
async function apiDelete(table, id){
  const r = await fetch(`${API_BASE}/api/${table}/${id}`, { method:'DELETE' });
  if(r.status===204) return true;
  const data = await r.json().catch(()=>({}));
  throw new Error(data.error || 'Falha ao excluir registro.');
}

async function checkDbStatus(){
  const el = document.getElementById('db-status');
  if(!el) return;
  try{
    const r = await fetch(`${API_BASE}/api/health/check`);
    const data = await r.json();
    if(r.ok && data.status==='ok'){
      el.innerHTML = '<span class="w-2 h-2 rounded-full bg-[#10b981]"></span> Neon conectado';
    } else { throw new Error(); }
  }catch(err){
    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-[#ef4444]"></span> Sem conexão';
  }
}

async function loadDB(){
  const activeEntities = ENTITIES.filter(e => !e.isHome && !e.isReport && !e.isCustom && !e.isCustomMap);
  const results = await Promise.allSettled(activeEntities.map(e => apiList(e.key)));
  let hasError = false;

  activeEntities.forEach((e, idx) => {
    const res = results[idx];
    if (res.status === 'fulfilled') {
      db[e.key] = res.value;
    } else {
      db[e.key] = [];
      hasError = true;
    }
  });

  if (hasError) {
    showToast('Atenção: Alguma tabela não pôde ser carregada.');
  }

  initGlobalEvento();
  buildLayout();
  checkDbStatus();
}

function initGlobalEvento(){
  const eventos = db['evento'] || [];
  const select = document.getElementById('global-evento-filter');
  if(!select) return;
  if(eventos.length === 0){
    select.innerHTML = '<option value="">Nenhum evento cadastrado</option>';
    globalEventoId = null;
    return;
  }
  select.innerHTML = eventos.map(ev => `<option value="${ev.codevento}">${escapeHtml(ev.descricao)}</option>`).join('');
  if(!globalEventoId || !eventos.some(e => e.codevento == globalEventoId)){
    globalEventoId = eventos[0].codevento;
  }
  select.value = globalEventoId;
  updateDashboardDateOptions();
}

function updateDashboardDateOptions(){
  const ev = (db['evento']||[]).find(e => e.codevento == globalEventoId);
  const selectDate = document.getElementById('dashboard-date-filter');
  const selectRepDate = document.getElementById('relatorio-date-filter');

  if(!ev || !ev.data_inicio || !ev.data_final){
    if(selectDate){
      selectDate.innerHTML = '<option value="ALL">Todas as Datas</option>';
      dashboardDataFilter = 'ALL';
    }
    if(selectRepDate){
      selectRepDate.innerHTML = '<option value="ALL">Todas as Datas</option>';
      relatorioDataFilter = 'ALL';
    }
    return;
  }

  const dates = [];
  let curr = new Date(ev.data_inicio + 'T00:00:00');
  const end = new Date(ev.data_final + 'T00:00:00');
  while(curr <= end){
    dates.push(curr.toISOString().split('T')[0]);
    curr.setDate(curr.getDate() + 1);
  }

  let html = '<option value="ALL">Todas as Datas</option>';
  html += dates.map(d => `<option value="${d}">${formatDateBR(d)}</option>`).join('');
  
  if(selectDate){
    selectDate.innerHTML = html;
    selectDate.value = dashboardDataFilter;
  }
  if(selectRepDate){
    selectRepDate.innerHTML = html;
    selectRepDate.value = relatorioDataFilter;
  }
}

async function showTab(key){
  if(isPublicView && key === 'relatorios') return;
  current = key;
  sidebarOpen = false;
  const sidebar = document.getElementById('sidebar-nav');
  if(sidebar) sidebar.classList.add('hidden');

  try {
    const activeEntities = ENTITIES.filter(e => !e.isHome && !e.isReport && !e.isCustom && !e.isCustomMap);
    const results = await Promise.allSettled(activeEntities.map(e => apiList(e.key)));
    activeEntities.forEach((e, idx) => {
      if (results[idx].status === 'fulfilled') {
        db[e.key] = results[idx].value;
      }
    });
  } catch (err) {
    console.error("Erro ao sincronizar dados:", err);
  }

  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  const targetTab = document.getElementById('tab-'+key);
  if(targetTab) targetTab.classList.add('active');
  
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  const targetNav = document.getElementById('nav-'+key);
  if(targetNav) targetNav.classList.add('active');
  
  renderCurrentTab();
  updateCounts();
}

function renderCurrentTab(){
  if(current === 'home'){
    renderDashboard();
  } else if(current === 'relatorios'){
    renderRelatorios();
  } else if(current === 'designacoes'){
    renderDesignacoes();
  } else if(current === 'mapa'){
    renderMapa();
  } else {
    renderTable(current);
  }
}

function renderDashboardChart(contagens, periodos){
  const ctx1 = document.getElementById('chartCanvas1');
  if(!ctx1) return;

  const diasUnicos = dashboardDataFilter === 'ALL' ? [...new Set(contagens.map(c => c.data))].sort() : [dashboardDataFilter];
  
  const labels1 = [];
  const dataValues1 = [];
  const backgroundColors1 = [];
  const palette = ['#06b6d4', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#f97316', '#a855f7', '#14b8a6', '#6366f1'];

  diasUnicos.forEach((dia, idx) => {
    periodos.forEach((per, pIdx) => {
      if (dashboardPeriodoFilter !== 'ALL' && String(per.codperiodo) !== String(dashboardPeriodoFilter)) return;
      
      const subCont = contagens.filter(c => c.data === dia && String(c.codperiodo) === String(per.codperiodo));
      const totalPer = subCont.reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);
      
      labels1.push(`${formatDateBR(dia)} (${per.descricao})`);
      dataValues1.push(totalPer);

      const baseColor = palette[idx % palette.length];
      backgroundColors1.push(pIdx === 0 ? baseColor : `${baseColor}99`);
    });
  });

  if(chartInstance1) chartInstance1.destroy();

  chartInstance1 = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: labels1.length > 0 ? labels1 : ['Nenhum dado'],
      datasets: [{
        label: 'Quantidade de Contagem',
        data: dataValues1.length > 0 ? dataValues1 : [0],
        backgroundColor: backgroundColors1.length > 0 ? backgroundColors1 : ['#3b82f6'],
        borderWidth: 1,
        borderColor: '#334155',
        borderRadius: 6,
        barPercentage: 0.7,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#ffffff',
          bodyColor: '#cbd5e1',
          borderColor: '#334155',
          borderWidth: 1,
          padding: 10,
          displayColors: false
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(51, 65, 85, 0.3)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
        },
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(51, 65, 85, 0.4)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
        }
      }
    }
  });
}

function renderRelatorioCharts(contagens, periodos, setores){
  const ctx1 = document.getElementById('chartCanvasRep1');
  const ctx2 = document.getElementById('chartCanvasRep2');
  if(!ctx1 || !ctx2) return;

  const diasUnicos = relatorioDataFilter === 'ALL' ? [...new Set(contagens.map(c => c.data))].sort() : [relatorioDataFilter];
  
  const labels1 = [];
  const dataValues1 = [];
  const backgroundColors1 = [];
  const palette = ['#06b6d4', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#f97316', '#a855f7', '#14b8a6', '#6366f1'];

  diasUnicos.forEach((dia, idx) => {
    periodos.forEach((per, pIdx) => {
      if (relatorioPeriodoFilter !== 'ALL' && String(per.codperiodo) !== String(relatorioPeriodoFilter)) return;
      
      const subCont = contagens.filter(c => c.data === dia && String(c.codperiodo) === String(per.codperiodo));
      const totalPer = subCont.reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);
      
      labels1.push(`${formatDateBR(dia)} (${per.descricao})`);
      dataValues1.push(totalPer);

      const baseColor = palette[idx % palette.length];
      backgroundColors1.push(pIdx === 0 ? baseColor : `${baseColor}99`);
    });
  });

  const labels2 = [];
  diasUnicos.forEach(dia => {
    periodos.forEach(per => {
      if (relatorioPeriodoFilter !== 'ALL' && String(per.codperiodo) !== String(relatorioPeriodoFilter)) return;
      const temReg = contagens.some(c => c.data === dia && String(c.codperiodo) === String(per.codperiodo));
      if (relatorioDataFilter !== 'ALL' || temReg) {
        labels2.push(`${formatDateBR(dia)} (${per.descricao})`);
      }
    });
  });

  const datasets2 = setores.map((setor, idx) => {
    const dataPoints = [];
    diasUnicos.forEach(dia => {
      periodos.forEach(per => {
        if (relatorioPeriodoFilter !== 'ALL' && String(per.codperiodo) !== String(relatorioPeriodoFilter)) return;
        const temReg = contagens.some(c => c.data === dia && String(c.codperiodo) === String(per.codperiodo));
        if (relatorioDataFilter !== 'ALL' || temReg) {
          const sub = contagens.filter(c => c.data === dia && String(c.codperiodo) === String(per.codperiodo) && c.codsetor == setor.codsetor);
          const totalSetor = sub.reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);
          dataPoints.push(totalSetor);
        }
      });
    });

    const color = palette[idx % palette.length];
    return {
      label: setor.descricao,
      data: dataPoints,
      backgroundColor: color,
      borderRadius: 4,
      borderWidth: 1,
      borderColor: '#334155'
    };
  });

  if(chartInstanceRep1) chartInstanceRep1.destroy();
  if(chartInstanceRep2) chartInstanceRep2.destroy();

  chartInstanceRep1 = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: labels1.length > 0 ? labels1 : ['Nenhum dado'],
      datasets: [{
        label: 'Quantidade de Contagem',
        data: dataValues1.length > 0 ? dataValues1 : [0],
        backgroundColor: backgroundColors1.length > 0 ? backgroundColors1 : ['#3b82f6'],
        borderWidth: 1,
        borderColor: '#334155',
        borderRadius: 6,
        barPercentage: 0.7,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#ffffff',
          bodyColor: '#cbd5e1',
          borderColor: '#334155',
          borderWidth: 1,
          padding: 10,
          displayColors: false
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(51, 65, 85, 0.3)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
        },
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(51, 65, 85, 0.4)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
        }
      }
    }
  });

  chartInstanceRep2 = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: labels2.length > 0 ? labels2 : ['Nenhum dado'],
      datasets: datasets2.length > 0 ? datasets2 : [{ label: 'Nenhum setor', data: [0], backgroundColor: '#10b981' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { 
          display: true, 
          position: 'bottom',
          labels: { color: '#94a3b8', font: { size: 11, family: 'Inter' }, boxWidth: 12 }
        },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#ffffff',
          bodyColor: '#cbd5e1',
          borderColor: '#334155',
          borderWidth: 1,
          padding: 10
        }
      },
      scales: {
        x: {
          stacked: false,
          grid: { color: 'rgba(51, 65, 85, 0.3)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' } }
        },
        y: {
          stacked: false,
          beginAtZero: true,
          grid: { color: 'rgba(51, 65, 85, 0.4)' },
          ticks: { color: '#94a3b8', font: { size: 11, family: 'Inter' }, precision: 0 }
        }
      }
    }
  });
}

function abrirModalFiltroSetores(){
  const evId = globalEventoId;
  const ev = (db['evento']||[]).find(e => e.codevento == evId);
  const periodos = db['periodo'] || [];

  const selectDate = document.getElementById('report-filter-date');
  const selectPeriodo = document.getElementById('report-filter-periodo');

  if(!ev || !ev.data_inicio || !ev.data_final){
    selectDate.innerHTML = '<option value="">Nenhuma data no evento</option>';
  } else {
    const dates = [];
    let curr = new Date(ev.data_inicio + 'T00:00:00');
    const end = new Date(ev.data_final + 'T00:00:00');
    while(curr <= end){
      dates.push(curr.toISOString().split('T')[0]);
      curr.setDate(curr.getDate() + 1);
    }
    selectDate.innerHTML = dates.map(d => `<option value="${d}">${formatDateBR(d)}</option>`).join('');
  }

  selectPeriodo.innerHTML = periodos.map(p => `<option value="${p.codperiodo}">${escapeHtml(p.descricao)}</option>`).join('');

  openModal('modal-report-filter');
}

function confirmarGerarPdfSetores(){
  const dataSelecionada = document.getElementById('report-filter-date').value;
  const periodoSelecionado = document.getElementById('report-filter-periodo').value;

  if(!dataSelecionada || !periodoSelecionado){
    showToast('Selecione a data e o período.');
    return;
  }

  closeModal('modal-report-filter');
  gerarPdfSetores(dataSelecionada, periodoSelecionado);
}

function gerarPdfSetores(selData, selPeriodo){
  const evId = globalEventoId;
  const setores = (db['setor']||[]).filter(s => !evId || s.codevento == evId);
  const escalas = (db['escalas']||[]).filter(es => {
    if(evId && es.codevento != evId) return false;
    if(es.data !== selData) return false;
    if(es.codperiodo && String(es.codperiodo) !== String(selPeriodo)) return false;
    return true;
  });

  const cleanRows = setores.map((setor, i) => {
    const setorNome = setor ? setor.descricao : '';
    const numAss = setor && setor.numass ? String(setor.numass) : '';
    let indicadorNome = '';
    if(setor){
      const esc = escalas.find(e => e.codsetor == setor.codsetor);
      if(esc){
        const pes = findRecord('pessoa', esc.codpessoa);
        if(pes) indicadorNome = pes.nomecompleto;
      }
    }
    return [
      { text: setorNome, border: [false, false, false, true], margin: [0, 10, 5, 2], fontSize: 10 },
      { text: numAss, border: [false, false, false, true], alignment: 'center', margin: [0, 10, 5, 2], fontSize: 10 },
      { text: `${i+1}.  ${indicadorNome}`, border: [false, false, false, true], margin: [0, 10, 0, 2], fontSize: 10 }
    ];
  });

  if(cleanRows.length === 0){
    cleanRows.push([
      { text: 'Nenhum setor cadastrado', border: [false, false, false, true], margin: [0, 10, 5, 2], fontSize: 10 },
      { text: '', border: [false, false, false, true], alignment: 'center', margin: [0, 10, 5, 2], fontSize: 10 },
      { text: '1.', border: [false, false, false, true], margin: [0, 10, 0, 2], fontSize: 10 }
    ]);
  }

  const docDefinition = {
    pageSize: 'A4',
    pageMargins: [40, 40, 40, 40],
    content: [
      {
        table: {
          headerRows: 4,
          widths: ['30%', '25%', '45%'],
          body: [
            [
              { text: 'CARTÃO DE CONTAGEM DA ASSISTÊNCIA DO CONGRESSO', colSpan: 3, alignment: 'center', bold: true, fontSize: 13, border: [false, false, false, false], margin: [0, 0, 0, 15] },
              {}, {}
            ],
            [
              { text: 'Capitão dos indicadores: ____________________________________________________', colSpan: 3, fontSize: 10, border: [false, false, false, false], margin: [0, 0, 0, 15] },
              {}, {}
            ],
            [
              { text: '', colSpan: 3, border: [false, false, false, false], margin: [0, 0, 0, 5] },
              {}, {}
            ],
            [
              { text: 'SETOR', bold: true, fontSize: 10, border: [false, false, false, true], margin: [0, 0, 0, 5] },
              { text: 'N.º DE ASSENTOS', bold: true, fontSize: 10, alignment: 'center', border: [false, false, false, true], margin: [0, 0, 0, 5] },
              { text: 'NOME DO INDICADOR', bold: true, fontSize: 10, border: [false, false, false, true], margin: [0, 0, 0, 5] }
            ],
            ...cleanRows
          ]
        }
      }
    ]
  };

  pdfMake.createPdf(docDefinition).open();
}

function gerarPdfistencia(){
  const evId = globalEventoId;
  const eventoObj = (db['evento']||[]).find(e => e.codevento == evId);
  const parametros = (db['parametros']||[]).filter(p => !evId || p.codevento == evId);
  const contagens = (db['contagem']||[]).filter(ct => !evId || ct.codevento == evId);

  const diasUnicos = [];
  if(eventoObj && eventoObj.data_inicio && eventoObj.data_final){
    let curr = new Date(eventoObj.data_inicio + 'T00:00:00');
    const end = new Date(eventoObj.data_final + 'T00:00:00');
    while(curr <= end){
      diasUnicos.push(curr.toISOString().split('T')[0]);
      curr.setDate(curr.getDate() + 1);
    }
  } else {
    const setDatas = new Set([...parametros.map(p => p.datacont), ...contagens.map(c => c.data)]);
    diasUnicos.push(...[...setDatas].sort());
  }

  const labelsDias = ['PRIMEIRO DIA', 'SEGUNDO DIA', 'TERCEIRO DIA', 'QUARTO DIA', 'QUINTO DIA', 'SEXTO DIA'];
  let bodyRows = [];
  
  diasUnicos.forEach((dia, index) => {
    const diaLabel = labelsDias[index] || `${index+1}º DIA`;
    const paramsDoDia = parametros.filter(p => p.datacont === dia);

    if(paramsDoDia.length > 0){
      paramsDoDia.forEach((param, pIdx) => {
        const horaCont = param.horacont ? param.horacont.substring(0, 5) : '--:--';
        const contsDoParam = contagens.filter(c => c.data === dia && String(c.codperiodo) === String(param.codperiodo));
        const somaAssistencia = contsDoParam.reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);

        bodyRows.push([
          { text: pIdx === 0 ? diaLabel : '', bold: true, fontSize: 10, border: [true, true, true, true], margin: [0, 15, 0, 15] },
          { text: horaCont, alignment: 'center', fontSize: 11, border: [true, true, true, true], fillColor: '#f1f5f9', margin: [0, 10, 0, 10] },
          { text: somaAssistencia > 0 ? String(somaAssistencia) : '', alignment: 'center', fontSize: 11, border: [true, true, true, true], margin: [0, 15, 0, 15] }
        ]);
      });
    } else {
      bodyRows.push([
        { text: diaLabel, bold: true, fontSize: 10, border: [true, true, true, true], margin: [0, 15, 0, 15] },
        { text: '--:--', alignment: 'center', fontSize: 11, border: [true, true, true, true], fillColor: '#f1f5f9', margin: [0, 10, 0, 10] },
        { text: '', alignment: 'center', fontSize: 11, border: [true, true, true, true], margin: [0, 15, 0, 15] }
      ]);
    }
  });

  if(bodyRows.length === 0){
    bodyRows.push([
      { text: 'PRIMEIRO DIA', bold: true, fontSize: 10, border: [true, true, true, true], margin: [0, 15, 0, 15] },
      { text: '--:--', alignment: 'center', fontSize: 11, border: [true, true, true, true], fillColor: '#f1f5f9', margin: [0, 10, 0, 10] },
      { text: '', alignment: 'center', fontSize: 11, border: [true, true, true, true], margin: [0, 15, 0, 15] }
    ]);
  }

  const docDefinition = {
    pageSize: 'A4',
    pageMargins: [40, 40, 40, 40],
    content: [
      { text: 'ATENÇÃO: Tenha pronto, sem falta, o total de cada sessão logo após a hora indicada abaixo, para que um representante do Departamento de Indicadores possa recolhê-lo.', fontSize: 9, bold: true, margin: [0, 0, 0, 20] },
      {
        table: {
          widths: ['30%', '40%', '30%'],
          body: [
            [
              { text: 'DIA', bold: true, fontSize: 10, border: [true, true, true, true], margin: [0, 0, 0, 8] },
              { text: 'HORA DA CONTAGEM', bold: true, fontSize: 10, alignment: 'center', border: [true, true, true, true], margin: [0, 0, 0, 8] },
              { text: 'ASSISTÊNCIA', bold: true, fontSize: 10, alignment: 'center', border: [true, true, true, true], margin: [0, 0, 0, 8] }
            ],
            [
              { text: '(USE APENAS OS DIAS QUE SE APLICAM.)', colSpan: 3, alignment: 'center', fontSize: 9, color: '#64748b', border: [true, true, true, true], margin: [0, 5, 0, 15] },
              {}, {}
            ],
            ...bodyRows
          ]
        }
      },
      {
        columns: [
          { text: 'CO-24-T   02/13 (01/20)', fontSize: 9, margin: [0, 40, 0, 0] },
          { text: '2', alignment: 'right', fontSize: 9, margin: [0, 40, 0, 0] }
        ]
      }
    ]
  };

  pdfMake.createPdf(docDefinition).open();
}

    const setorB = refRelationDescricao('setor', b.codsetor);

    <div class="flex-1 bg-[#1e293b] rounded-xl border border-[#334155] overflow-hidden flex flex-col min-h-0 mb-6">
      <div class="flex-1 overflow-y-auto relative pb-16">
        <table class="w-full text-sm border-collapse">
          <thead class="sticky top-0 z-20 bg-[#0f172a]">
            <tr class="text-left text-xs text-[#94a3b8] uppercase tracking-wider border-b border-[#334155]">
              <th class="px-6 py-3 bg-[#0f172a]">Data</th>
              <th class="px-6 py-3 bg-[#0f172a]">Pessoa</th>
              <th class="px-6 py-3 bg-[#0f172a]">Setor</th>
              <th class="px-6 py-3 bg-[#0f172a]">Início</th>
              <th class="px-6 py-3 bg-[#0f172a]">Fim</th>
              <th class="px-6 py-3 bg-[#0f172a]">Telefone (WhatsApp)</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || `<tr><td colspan="6" class="text-center text-[#64748b] py-12">Nenhuma designação encontrada.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function renderMapa(){
  const tabMapa = document.getElementById('tab-mapa');
  if(!tabMapa) return;

  let mapaRec = null;
  try {
    const res = await apiList('configmapa');
    mapaRec = (res || []).find(m => !globalEventoId || m.codevento == globalEventoId);
  } catch(e) {}

  const imgSrc = mapaRec && mapaRec.imagem_base64 ? mapaRec.imagem_base64 : '';

  let uploadSection = '';
  if (!isPublicView) {
    uploadSection = `
      <div class="mb-6 bg-[#1e293b] border border-[#334155] rounded-xl p-4 flex items-center justify-between flex-wrap gap-4 flex-shrink-0">
        <div>
          <h4 class="text-sm font-bold text-white mb-1">Atualizar Imagem do Mapa</h4>
          <p class="text-xs text-[#94a3b8]">Selecione um arquivo de imagem (JPG ou PNG) do seu computador para definir o mapa deste evento.</p>
        </div>
        <div class="flex items-center gap-3">
          <input type="file" id="map-file-input" accept="image/*" class="text-xs text-[#94a3b8] file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#3b82f6] file:text-white hover:file:bg-[#2563eb] cursor-pointer">
          <button onclick="salvarNovoMapa()" class="bg-[#10b981] hover:bg-[#059669] text-white text-xs font-medium px-4 py-2 rounded-lg transition-colors">Salvar Imagem</button>
        </div>
      </div>
    `;
  }

  let contentHtml = '';
  if(imgSrc){
    contentHtml = `<img src="${imgSrc}" alt="Mapa do Evento" class="max-w-full h-auto rounded border border-[#334155] shadow-md bg-white">`;
  } else {
    contentHtml = `
      <div class="text-center py-12">
        <svg class="w-12 h-12 mx-auto text-[#64748b] mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <p class="text-sm text-[#94a3b8] font-medium">Nenhum mapa cadastrado para este evento.</p>
        <p class="text-xs text-[#64748b] mt-1">Utilize o botão acima para enviar a imagem do mapa.</p>
      </div>`;
  }

  tabMapa.innerHTML = `
    <div class="flex-shrink-0 mb-4">
      <h2 class="text-2xl font-bold text-white mb-1">Mapa do Evento</h2>
      <p class="text-[#94a3b8] text-sm">Visualização detalhada do layout e setores do congresso</p>
    </div>
    ${uploadSection}
    <div class="flex-1 bg-[#1e293b] border border-[#334155] rounded-xl p-6 flex justify-center items-center shadow-lg overflow-y-auto mb-6">
      ${contentHtml}
    </div>
  `;
}

async function salvarNovoMapa(){
  const fileInput = document.getElementById('map-file-input');
  if(!fileInput || fileInput.files.length === 0){
    showToast('Selecione uma imagem primeiro.');
    return;
  }
  if(!globalEventoId){
    showToast('Selecione um evento ativo primeiro.');
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = async function(e){
    const base64Data = e.target.result;
    try {
      const response = await fetch(`${API_BASE}/api/configmapa/salvar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codevento: globalEventoId, imagem_base64: base64Data })
      });
      
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || 'Erro ao salvar');

      showToast('Mapa atualizado com sucesso!');
      renderMapa();
    } catch(err) {
      showToast('Erro ao salvar mapa: ' + err.message);
    }
  };
  reader.readAsDataURL(file);
}

function refRelationDescricao(refKey, id){
  const ent = entity(refKey), rec = findRecord(refKey, id);
  return rec ? ent.display(rec) : '';
}

function onSearchDesignacaoPessoa(val){
  window._designacaoSearchPessoa = val;
  renderDesignacoes();
}

function updateCounts(){
  const evId = globalEventoId;
  ENTITIES.filter(e=>!e.isHome && !e.isReport && !e.isCustom && !e.isCustomMap).forEach(e=>{
    const el = document.getElementById('nav-count-'+e.key);
    if(el){
      const filtered = (db[e.key]||[]).filter(r => e.isGlobal || r.codevento == evId);
      el.textContent = filtered.length;
    }
  });
}

function onSearch(key, value){
  entity(key)._search = value.toLowerCase();
  renderTable(key);
}

function renderTable(key){
  const ent = entity(key);
  const tbody = document.getElementById('tabela-'+key);
  const emptyEl = document.getElementById('empty-'+key);
  let rows = db[key] || [];

  if(!ent.isGlobal && key !== 'evento'){
    rows = rows.filter(r => !globalEventoId || r.codevento == globalEventoId);
  }

  if(ent._search){
    const q = ent._search;
    rows = rows.filter(r=>{
      return ent.fields.filter(f => !f.hiddenInTable).some(f=>{
        let v = f.type==='fk' ? refLabel(f.ref, r[f.name]) : r[f.name];
        if(f.type==='date') v = formatDateBR(v);
        return String(v||'').toLowerCase().includes(q);
      }) || String(r[ent.pk]).includes(q);
    });
  }

  const tableEl = tbody.closest('table');
  if((db[key]||[]).length===0){
    tbody.innerHTML=''; tableEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    emptyEl.innerHTML = `Nenhum registro em <b class="text-white">${ent.plural}</b> ainda.`;
    return;
  }
  tableEl.classList.remove('hidden');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyEl.classList.remove('hidden');
    emptyEl.innerHTML = `Nenhum registro encontrado.`;
    return;
  }
  emptyEl.classList.add('hidden');

  tbody.innerHTML = rows.map(r=>{
    const tableFields = ent.fields.filter(f => !f.hiddenInTable);
    const cells = tableFields.map(f=>{
      if(f.type==='fk'){
        return `<td class="px-6 py-4 text-[#cbd5e1]">${escapeHtml(refLabel(f.ref, r[f.name]))} <span class="text-[#64748b] font-mono text-xs">#${r[f.name]}</span></td>`;
      }
      let val = r[f.name];
      if(f.type==='date') val = formatDateBR(val);
      if(f.name==='ativo') val = (val===true || val==='true') ? 'SIM' : 'NÃO';
      return `<td class="px-6 py-4 text-[#cbd5e1]">${val!==undefined && val!==null && val!=='' ? escapeHtml(String(val)) : '—'}</td>`;
    }).join('');
    
    let actionsCell = '';
    const showEdit = !isPublicView || (key === 'contagem' && !isPublicView);
    const showDelete = !isPublicView;

    if (showEdit || showDelete) {
      actionsCell = `<td class="px-6 py-4 whitespace-nowrap">
        ${showEdit ? `<button onclick="openEntityModal('${key}', ${r[ent.pk]})" class="text-[#3b82f6] hover:text-[#60a5fa] text-xs font-medium mr-3">Editar</button>` : ''}
        ${showDelete ? `<button onclick="deleteRecord('${key}', ${r[ent.pk]})" class="text-[#ef4444] hover:text-[#f87171] text-xs font-medium">Excluir</button>` : ''}
      </td>`;
    }

    return `<tr class="hover:bg-[#334155]/30 transition-colors border-t border-[#334155]/60">
      <td class="px-6 py-4 font-mono text-[#3b82f6]">${r[ent.pk]}</td>
      ${cells}
      ${actionsCell}
    </tr>`;
  }).join('');
}

function openEntityModal(key, id){
  if(isPublicView && key === 'contagem' && id !== undefined) return;
  const ent = entity(key);
  modalState = { key, editingId: id!==undefined ? id : null };
  const record = id!==undefined ? findRecord(key,id) : null;

  document.getElementById('modal-title').textContent = record ? `Editar ${ent.label}` : `Novo ${ent.label}`;
  document.getElementById('modal-sub').textContent = `Preencha os campos de ${ent.plural.toLowerCase()}.`;

  const ev = (db['evento']||[]).find(e => e.codevento == globalEventoId);

  const fieldsEl = document.getElementById('modal-fields');
  fieldsEl.innerHTML = ent.fields.map(f=>{
    let val = record ? record[f.name] : '';
    if(!record && !ent.isGlobal && f.fixedToGlobal && globalEventoId && f.name === 'codevento'){
      val = globalEventoId;
    }

    if(!record && f.type === 'date' && (key === 'contagem' || key === 'escalas')) {
      val = '';
    }

    let control;
    const base = "w-full bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2.5 text-sm text-white placeholder-[#64748b] focus:outline-none focus:border-[#3b82f6]";
    
    if(f.name === 'ativo' && key === 'parametros'){
      const isChecked = record ? (record.ativo === true || record.ativo === 'true') : true;
      control = `<div class="flex items-center gap-3 pt-1">
        <input type="checkbox" data-field="${f.name}" ${isChecked ? 'checked' : ''} class="w-5 h-5 accent-[#3b82f6] rounded cursor-pointer">
        <span class="text-sm text-[#cbd5e1]">Liberado para contagens neste dia</span>
      </div>`;
    } else if(f.type==='fk'){
      const refEnt = entity(f.ref);
      let refList = db[f.ref] || [];
      if(!refEnt.isGlobal && f.fixedToGlobal && globalEventoId){
        refList = refList.filter(r => r.codevento == globalEventoId);
      }

      const onChangeAttr = f.onPeriodChange ? 'onchange="onEscalaPeriodoChange(this.value)"' : '';
      const opts = refList.map(r=>{
        const rid = r[refEnt.pk];
        return `<option value="${rid}" ${val == rid ? 'selected':''}>${escapeHtml(refEnt.display(r))} (#${rid})</option>`;
      }).join('');
      
      if(f.fixedToGlobal && !ent.isGlobal){
        control = `<select data-field="${f.name}" ${onChangeAttr} class="${base} bg-[#1e293b]" ${!record ? 'disabled':''}><option value="">Selecione…</option>${opts}</select>${!record ? `<input type="hidden" data-field="${f.name}" value="${val}">` : ''}`;
      } else {
        control = `<select data-field="${f.name}" ${onChangeAttr} class="${base}"><option value="">Selecione…</option>${opts}</select>`;
      }
    } else if(f.type==='date'){
      let minAttr = '';
      let maxAttr = '';
      if(f.limitToEvent && ev && ev.data_inicio && ev.data_final){
        minAttr = `min="${ev.data_inicio}"`;
        maxAttr = `max="${ev.data_final}"`;
      }

      if(key === 'contagem' && f.name === 'data'){
        const paramsAtivos = (db['parametros']||[]).filter(p => (!globalEventoId || p.codevento == globalEventoId) && (p.ativo === true || p.ativo === 'true'));
        const datasAtivas = [...new Set(paramsAtivos.map(p => p.datacont))].sort();
        
        let dateOpts = '<option value="">Selecione uma data liberada…</option>' + datasAtivas.map(d => `<option value="${d}" ${val === d ? 'selected' : ''}>${formatDateBR(d)}</option>`).join('');
        control = `<select data-field="${f.name}" class="${base}">${dateOpts}</select>`;
      } else {
        control = `<input type="date" data-field="${f.name}" value="${val||''}" ${minAttr} ${maxAttr} class="${base}">`;
      }
    } else if(f.type==='time'){
      const readonlyAttr = f.readonly ? 'readonly style="background-color: #111827; color: #9ca3af; cursor: not-allowed;"' : '';
      control = `<input type="time" data-field="${f.name}" value="${val||''}" ${readonlyAttr} class="${base}">`;
    } else if(f.type==='number'){
      control = `<input type="number" data-field="${f.name}" value="${val!==undefined && val!==null ? val : ''}" placeholder="${f.placeholder||''}" class="${base}">`;
    } else {
      control = `<input type="text" data-field="${f.name}" value="${escapeHtml(val||'')}" placeholder="${f.placeholder||''}" class="${base}" oninput="this.value = this.value.toUpperCase()">`;
    }
    return `<div data-field-wrap="${f.name}">
      <label class="block text-xs font-medium text-[#94a3b8] mb-1.5">${f.label}${f.required ? ' <span class="text-[#ef4444]">*</span>':''}</label>
      ${control}
      <p class="err-msg hidden text-xs text-[#ef4444] mt-1 font-mono"></p>
    </div>`;
  }).join('');

  openModal('modal-form');

  if(key === 'escalas'){
    const initialPeriodoEl = document.querySelector('#modal-form [data-field="codperiodo"]');
    if(initialPeriodoEl && initialPeriodoEl.value){
      onEscalaPeriodoChange(initialPeriodoEl.value);
    }
  }
}

function onEscalaPeriodoChange(codPeriodo){
  const periodo = (db['periodo']||[]).find(p => String(p.codperiodo) === String(codPeriodo));
  const horaInicioInput = document.querySelector('#modal-form [data-field="hora_inicio"]');
  const horaFimInput = document.querySelector('#modal-form [data-field="hora_fim"]');

  if(periodo){
    if(horaInicioInput) horaInicioInput.value = periodo.horario_inicial || '';
    if(horaFimInput) horaFimInput.value = periodo.horario_final || '';
  } else {
    if(horaInicioInput) horaInicioInput.value = '';
    if(horaFimInput) horaFimInput.value = '';
  }
}

document.getElementById('entity-form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  const { key, editingId } = modalState;
  if(isPublicView && key === 'contagem' && editingId !== null) return;
  const ent = entity(key);
  const form = ev.target;
  const values = {};
  let hasError = false;

  const eventoObj = (db['evento']||[]).find(e => e.codevento == globalEventoId);

  ent.fields.forEach(f=>{
    const el = form.querySelector(`[data-field="${f.name}"]`);
    if(!el) return;
    const wrap = form.querySelector(`[data-field-wrap="${f.name}"]`);
    const err = wrap.querySelector('.err-msg');
    el.classList.remove('field-error'); err.classList.add('hidden');
    let raw;

    if(f.name === 'ativo' && key === 'parametros'){
      raw = el.checked;
    } else {
      raw = el.value;
    }

    if(!ent.isGlobal && f.fixedToGlobal && !editingId && f.name === 'codevento' && globalEventoId){
      raw = globalEventoId;
    }

    if(f.required && !raw && raw !== false){
      el.classList.add('field-error');
      err.textContent = 'Campo obrigatório.';
      err.classList.remove('hidden');
      hasError = true;
      return;
    }

    if(f.type === 'date' && f.limitToEvent && eventoObj && raw && key !== 'contagem'){
      if(raw < eventoObj.data_inicio || raw > eventoObj.data_final){
        el.classList.add('field-error');
        err.textContent = `A data deve estar entre ${formatDateBR(eventoObj.data_inicio)} e ${formatDateBR(eventoObj.data_final)}.`;
        err.classList.add('hidden');
        hasError = true;
        return;
      }
    }

    if(f.name === 'ativo' && key === 'parametros'){
      values[f.name] = raw;
    } else if(f.type==='fk'){
      values[f.name] = raw ? Number(raw) : null;
    } else if(f.type==='number'){
      values[f.name] = raw!=='' ? Number(raw) : null;
    } else if(f.type==='date'){
      values[f.name] = raw || null;
    } else if(f.type==='time'){
      values[f.name] = raw || null;
    } else { 
      values[f.name] = (f.name === 'email') ? (raw ? raw.trim().toLowerCase() : null) : (raw ? raw.trim().toUpperCase() : null); 
    }
  });

  if(hasError){ showToast('Corrija os campos destacados.'); return; }

  const saveBtn = document.getElementById('modal-save-btn');
  saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';

  try{
    if(editingId!==null){
      const updated = await apiUpdate(key, editingId, values);
      const idx = db[key].findIndex(r=>r[ent.pk]===editingId);
      if(idx>-1) db[key][idx] = updated;
      showToast(`${ent.label} atualizado!`);
    } else {
      const created = await apiCreate(key, values);
      db[key].push(created);
      if(key === 'evento'){
        globalEventoId = created.codevento;
        initGlobalEvento();
      }
      showToast(`${ent.label} cadastrado!`);
    }
    buildLayout();
    closeModal('modal-form');
  }catch(err){
    showToast(err.message);
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = 'Salvar';
  }
});

async function deleteRecord(key, id){
  if(isPublicView) return;
  const ent = entity(key);
  if(!confirm(`Excluir o registro #${id} de ${ent.label}?`)) return;
  try{
    await apiDelete(key, id);
    db[key] = db[key].filter(r=>r[ent.pk]!==id);
    buildLayout();
    showToast(`${ent.label} excluído.`);
  }catch(err){
    showToast(err.message);
  }
}

function openModal(id){ document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

let toastTimer=null;
function showToast(msg){
  const toast = document.getElementById('toast');
  if(!toast) return;
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.remove('translate-y-20','opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toast.classList.add('translate-y-20','opacity-0'); }, 4000);
}

loadDB();
